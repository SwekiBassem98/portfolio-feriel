<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feriel Bouzid — Graphic Designer · Brand, Print & Social</title>
    <meta name="description" content="Portfolio of Feriel Bouzid, graphic designer based in Nabeul, Tunisia: brand identities, editorial print and social media design." />
    <meta name="author" content="Feriel Bouzid" />
    <meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="Feriel Bouzid — Graphic Designer" />
    <meta property="og:description" content="Brand identities, editorial print and social media design. Based in Nabeul, Tunisia." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/projects/moderna/Moderna-thumbnail.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/projects/moderna/Moderna-thumbnail.jpg" />

    <!-- Apply the saved / system theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        var l = localStorage.getItem("language");
        if (l === "fr") document.documentElement.lang = "fr";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
